<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed SDK Sample</title>
</head>

<body>
  <sp-theme scale="medium" color="light" system="express">
    <div class="container">
      <header>
        <h1>Adobe Express Embed SDK</h1>
        <sp-divider size="l"></sp-divider>
        <h2>Embedded Design Editor (EDE) Sample</h2>
        <p>
          First, click the <b>Create Design</b> button to launch a Template Browser experience that tethers to the
          Editor.
          <br />
          <b>Edit Design</b> will re-open the existing design in the Embedded Design Editor (EDE).
        </p>
      </header>

      <main>
        <img id="savedImage" src="https://placehold.co/300x300?text=Placeholder+Image&font=source-sans-pro"
          alt="Your design will appear here." />
        <sp-button-group>
          <sp-button id="createBtn">Create Design</sp-button>
          <sp-button id="editBtn" disabled>Edit Design</sp-button>
        </sp-button-group>
      </main>
    </div>
  </sp-theme>

  <script type="module" src="./main.js"></script>

</body>

</html>
