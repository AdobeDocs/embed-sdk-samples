<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed SDK Sample - Create With Template</title>
</head>

<body>
  <sp-theme scale="medium" color="light" system="express">
    <div class="container">
      <header>
        <h1>Adobe Express Embed SDK</h1>
        <sp-divider size="l"></sp-divider>
        <h2>Create With Template Sample</h2>
        <p>
          The <b>Create With Template</b> button launches the editor with a pre-selected template.
        </p>
      </header>

      <main>
        <img id="image" src="https://placehold.co/300x300?text=Your+design+will+appear+here&font=source-sans-pro" alt="Your design will appear here" />
        <sp-button-group>
          <sp-button id="createBtn">Create With Template</sp-button>
        </sp-button-group>
      </main>
    </div>
  </sp-theme>

  <script type="module" src="./main.js"></script>

</body>

</html>
