<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed SDK Sample</title>
</head>

<body>
  <sp-theme scale="medium" color="light" system="express">
    <div class="container">
      <header>
        <h1>Adobe Express Embed SDK</h1>
        <sp-divider size="l"></sp-divider>
        <h2>Merge Videos Sample</h2>
        <p>
          The <b>Merge Videos</b> button launches a quick action to combine multiple videos into one.
        </p>
      </header>

      <main>
        <div id="output-container">
          <p class="placeholder-text">Your merged video will appear here</p>
        </div>
        <sp-button-group>
          <sp-button id="mergeBtn">Merge Videos</sp-button>
        </sp-button-group>
      </main>
    </div>
  </sp-theme>

  <script type="module" src="./main.js"></script>

</body>

</html>
