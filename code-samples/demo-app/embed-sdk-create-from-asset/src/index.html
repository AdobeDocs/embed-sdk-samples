<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed SDK Sample</title>
</head>

<body>
  <sp-theme scale="medium" color="light" system="express">
    <div class="container">
      <header>
        <h1>Adobe Express Embed SDK</h1>
        <sp-divider size="l"></sp-divider>
        <h2>Create from Asset Sample</h2>
        <p>
          Select an image or video file, then click <b>Create from Asset</b> to load it into the full Adobe Express editor.
        </p>
      </header>

      <main>
        <div id="output-container">
          <p class="placeholder-text">Your design will appear here</p>
        </div>
        <sp-button-group>
          <sp-button id="uploadBtn">Choose File</sp-button>
          <sp-button id="createBtn">Create from Asset</sp-button>
        </sp-button-group>
        <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" />
      </main>
    </div>
  </sp-theme>

  <script type="module" src="./main.js"></script>

</body>

</html>
