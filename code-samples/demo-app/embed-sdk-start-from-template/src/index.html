<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embed SDK Sample</title>
</head>

<body>
  <sp-theme scale="medium" color="light" system="express">
    <div class="container">
      <header>
        <h1>Adobe Express Embed SDK</h1>
        <sp-divider size="l"></sp-divider>
        <h2>Start from Template Sample</h2>
        <p>
          The <b>Browse Templates</b> button launches a template browser where users can select and customize professionally designed templates.
        </p>

        <div class="template-version-container">
          <h3>Select Template Version</h3>
          <select id="templateVersion">
            <option value="v1">Version 1</option>
            <option value="v2">Version 2</option>
          </select>
        </div>
      </header>

      <main>
        <div id="output-container">
          <p class="placeholder-text">Your created design will appear here</p>
        </div>
        <sp-button-group>
          <sp-button id="browseBtn">Browse Templates</sp-button>
        </sp-button-group>
      </main>
    </div>
  </sp-theme>

  <script type="module" src="./main.js"></script>

</body>

</html>
